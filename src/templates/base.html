{{define "base"}}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEC - Tytyber Education Club</title>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        :root {
            --bg-color: #040904;
            --card-bg: #091209;
            --text-main: #e0ffe4;
            --text-dim: #6b8c6b;
            --neon-green: #00ff41;
            --border-color: rgba(0, 255, 65, 0.3);
            --glow: 0 0 8px rgba(0, 255, 65, 0.4);
            --font-tech: 'Courier New', Courier, monospace;
            --font-body: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            background-image:
                    linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-main);
            font-family: var(--font-body);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Sidebar */
        .sidebar {
            width: 240px;
            background: var(--card-bg);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .logo {
            font-family: var(--font-tech);
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--neon-green);
            margin-bottom: 2rem;
            text-shadow: var(--glow);
            letter-spacing: 2px;
        }
        .nav-link {
            display: block;
            color: var(--text-dim);
            text-decoration: none;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            border-radius: 4px;
            font-family: var(--font-tech);
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .nav-link:hover, .nav-link.active {
            color: var(--neon-green);
            background: rgba(0, 255, 65, 0.1);
            border-color: var(--border-color);
            text-shadow: 0 0 5px var(--neon-green);
        }
        /* Main Content */
        .main-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }
        /* Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--glow);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
            opacity: 0.5;
        }
        .card-header {
            font-family: var(--font-tech);
            font-size: 1.1rem;
            color: var(--neon-green);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }
        /* Typography */
        h1, h2, h3 { font-family: var(--font-tech); font-weight: normal; margin: 0 0 1rem 0; }
        .highlight { color: var(--neon-green); font-weight: bold; }
        .dim { color: var(--text-dim); font-size: 0.9rem; }
        /* Progress Bar */
        .progress-track {
            background: #112211;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.5rem;
            border: 1px solid var(--border-color);
        }
        .progress-fill {
            background: var(--neon-green);
            height: 100%;
            box-shadow: 0 0 10px var(--neon-green);
            transition: width 0.5s ease;
        }
        /* Buttons */
        .btn {
            background: transparent;
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 0.5rem 1rem;
            font-family: var(--font-tech);
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
            text-transform: uppercase;
            font-size: 0.8rem;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: var(--glow);
        }
        .btn-block { display: block; width: 100%; text-align: center; margin-bottom: 0.5rem; }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.7rem; }

        /* Grid for dashboard stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        /* HTMX Loading Indicator */
        .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; color: var(--neon-green); font-family: var(--font-tech); }
        .htmx-request .htmx-indicator { opacity: 1; }
        .htmx-request.htmx-indicator { opacity: 1; }

        /* Login override */
        body.login-page { display: flex; justify-content: center; align-items: center; background: var(--bg-color); }
        .login-box { width: 320px; }
    </style>
</head>
<body {{if .IsLogin}}class="login-page"{{end}}>
{{if not .IsLogin}}
<aside class="sidebar">
    <div class="logo">TEC // <span style="font-size:0.8rem; color:var(--text-dim);">BETA</span></div>
    <nav>
        <a href="/dashboard" class="nav-link active">01. DASHBOARD</a>
        <a href="/roadmap" class="nav-link">02. ROADMAP</a>
        <a href="/lessons" class="nav-link">03. LESSONS</a>
        <a href="/social" class="nav-link">04. SOCIAL</a>
        <a href="/profile" class="nav-link">05. PROFILE</a>
    </nav>
    <div style="margin-top: auto; border-top: 1px solid var(--border-color); padding-top: 1rem;">
        <form action="/logout" method="POST">
            <button type="submit" class="btn btn-block">LOGOUT [ESC]</button>
        </form>
    </div>
</aside>
<main class="main-content">
    {{end}}
    {{template "content" .}}
    {{if not .IsLogin}}
</main>
{{end}}
</body>
</html>
{{end}}

{{define "nav"}} {{end}}
