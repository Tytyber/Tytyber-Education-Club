{{define "login"}}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>TEC // AUTH</title>
  <style>
    :root { --bg: #040904; --card: #091209; --text: #e0ffe4; --accent: #00ff41; }
    body { background:var(--bg); color:var(--text); font-family:'Courier New', monospace; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    .login-box { background:var(--card); padding:2rem; border:1px solid rgba(0,255,65,0.3); width:300px; box-shadow: 0 0 15px rgba(0,255,65,0.2); }
    h2 { color:var(--accent); text-align:center; margin-top:0; }
    input { background:#112211; border:1px solid #334433; color:white; padding:0.8rem; width:100%; box-sizing:border-box; margin-bottom:1rem; font-family:'Courier New', monospace; }
    input:focus { outline:none; border-color:var(--accent); }
    button { background:var(--accent); color:black; border:none; padding:0.8rem; width:100%; font-weight:bold; cursor:pointer; font-family:'Courier New', monospace; text-transform:uppercase; }
    button:hover { box-shadow: 0 0 10px var(--accent); }
    .error { color:#ff4444; text-align:center; margin-bottom:1rem; font-size:0.8rem; }
    .link { text-align:center; margin-top:1rem; font-size:0.8rem; }
    .link a { color:var(--accent); text-decoration:none; }
    .link a:hover { text-decoration:underline; }
  </style>
</head>
<body>
<form class="login-box" method="POST" action="/login">
  <h2>> AUTH_REQUIRED</h2>
  {{if .error}}<div class="error">[ERROR] {{.error}}</div>{{end}}
  <input type="email" name="email" placeholder="EMAIL" required autocomplete="off">
  <input type="password" name="password" placeholder="PASSWORD" required>
  <button type="submit">INIT_SESSION</button>
</form>
<div class="link">
  New user? <a href="/register">REGISTER</a>
</div>
</body>
</html>
{{end}}
